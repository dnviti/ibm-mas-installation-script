# Maximo Application Suite Installation Configuration

# MAS Instance Configuration
mas:
  instance_id: "masdemosno"
  workspace_id: "masdemosno"
  workspace_name: "MAS Demo"
  ocp_project: ""
  net_domain: ""
  catalog_version: "v9-260924-amd64"
  channel: "9.2.x"
  operational_mode: "non-prod" # non-prod or prod
  # Obbligatorio per MAS 9.2+ (cluster, namespaced, minimal); lasciare vuoto per 9.1 e precedenti
  admin_mode: "cluster"

# IBM Entitlement
# Ordine di lettura: variabile d'ambiente IBM_ENTITLEMENT_KEY, questo campo,
# file files.entitlement_key. Consigliato: lasciare vuoto e usare il file in .secrets/
ibm:
  entitlement_key: ""

# Storage Configuration
storage:
  rwo_class: "longhorn"
  rwx_class: "longhorn"
  pipeline_class: "longhorn"
  access_mode: "ReadWriteOnce"

# User Data Service Configuration
# Valori reali in .secrets/config.local.yaml (vedi sotto)
uds:
  email: "email@example.com"
  firstname: "NOME"
  lastname: "COGNOME"

# Database Configuration
mongodb:
  namespace: "mongoce"

db2:
  manage: true
  channel: "v120105.0" # default del catalogo v9-260924-amd64
  namespace: "db2u"
  type: "db2wh"
  cpu_requests: "300m"
  cpu_limits: "6000m"
  memory_requests: "8Gi"
  memory_limits: "12Gi"
  backup_storage: "10Gi"
  data_storage: "20Gi"
  logs_storage: "10Gi"
  meta_storage: "10Gi"
  temp_storage: "10Gi"

# Maximo Manage Application Configuration
manage:
  install: true
  channel: "9.2.x"
  jdbc: "workspace-application"
  components: "base=latest,health=latest"
  server_bundle_size: "dev"
  demodata: true # carica i dati demo (MAXDEMO) in Manage

# Optional Applications (NON ancora gestite dallo script: i flag vengono ignorati)
applications:
  iot: false
  monitor: false
  predict: false
  optimizer: false
  assist: false
  visual_inspection: false
  facilities: false

# File sensibili: percorsi relativi a files.secrets_dir (cartella esclusa da git)
# Se esiste <secrets_dir>/config.local.yaml, i suoi valori sovrascrivono quelli di
# questo file: usarlo per dati personali o specifici dell'ambiente (es. uds.*).
# Attenzione: i valori vuoti ("") in config.local.yaml NON sovrascrivono i valori non vuoti di
# questo file (il parser scarta le chiavi vuote): per "svuotare" un valore, svuotarlo qui
files:
  secrets_dir: ".secrets"
  entitlement_key: "entitlement-key"
  pull_secret: "pull-secret"
  license: "license.dat"
  kubeconfig: "kubeconfig-masdemosno"

# Pre-configurazione del cluster (fasi "preflight" e "cluster" dello script)
# Con il solo kubeconfig lo script prepara il cluster prima di mas install.
# Tutti i comandi oc/helm girano nel container MAS CLI (sull'host non serve oc).
cluster:
  # false = salta Longhorn e StorageClass di default (l'image registry segue image_registry.configure)
  configure: true
  # StorageClass che deve essere l'UNICA di default; vuoto = storage.rwo_class
  default_storage_class: ""
  # Helm 3 scaricato nel container (da get.helm.sh) SOLO se il container non ha già helm:
  # l'immagine mas CLI di solito lo include e in quel caso helm_version non viene usato.
  # Il controllo sha256 verifica solo l'integrità del download (il checksum arriva dallo stesso host)
  helm_version: "3.19.0"
  longhorn:
    # false = Longhorn gestito altrove: lo script non lo installa e non ne tocca le impostazioni
    install: true
    # Un'installazione Longhorn già presente nel namespace NON viene mai aggiornata
    version: "1.13.0"
    namespace: "longhorn-system"
    # 1 per Single Node OpenShift; i parametri della StorageClass sono immutabili dopo la creazione
    replica_count: 1
    # Tag di quay.io/openshift/origin-oauth-proxy; vuoto = major.minor del cluster (es. 4.22)
    oauth_proxy_tag: ""
    # Impostazioni Longhorn (vuoto = non toccare). Su una nuova installazione vanno nei values Helm
    # (defaultSettings.priorityClass / storageMinimalAvailablePercentage). Su un Longhorn già presente
    # vengono patchate ad ogni esecuzione, ma longhorn-manager le riporta al valore del chart
    # (ConfigMap longhorn-default-setting) al riavvio: lo script lo segnala con un avviso
    settings:
      priority_class: "system-node-critical"
      storage_minimal_available_percentage: 10
  # Controlli della fase preflight (sola lettura)
  preflight:
    min_cpu: 16 # CPU allocabili minime, somma dei nodi Ready
    min_memory_gib: 48 # memoria allocabile minima in GiB, somma dei nodi Ready
    check_dns: true # api.<dominio> e un host *.apps devono risolvere dal container

# OpenShift Integrated Image Registry
# Richiesto da Manage per le build delle immagini (admin/server bundle).
# Su bare metal/SNO il registry è "Removed" di default: lo script lo abilita con un PVC.
image_registry:
  configure: true
  storage_class: "" # vuoto = storage.rwo_class
  size: "100Gi"

# Container Configuration
container:
  name: "mas-installer"
  image: "quay.io/ibmmas/cli:latest"
  network: "host"
  # Engine preference: "docker", "podman", or "auto" (auto-detect)
  engine: "podman"
